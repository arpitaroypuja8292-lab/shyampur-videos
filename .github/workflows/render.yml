name: Render Shyampur video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip project
        run: unzip -q shyampur-remotion.zip -d project

      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev \
            libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Render video (1920x1080, 30fps)
        working-directory: project
        run: npx remotion render Shyampur out/shyampur.mp4 --concurrency=4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: shyampur-video
          path: project/out/shyampur.mp4
          retention-days: 7
